name: Release

# Manual only - this never runs on a push/PR. Trigger it from the Actions
# tab (or `gh workflow run release.yml -f version=v1.2.3`) when you actually
# want to cut a build and publish it as a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version, e.g. v1.2.3"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure
        run: cmake -B build -DLAUNCHPAD_UI_RID=${{ matrix.rid }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          cd build/publish
          zip -r "../../Launchpad-${{ inputs.version }}-${{ matrix.rid }}.zip" .

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd build/publish
          tar -czf "../../Launchpad-${{ inputs.version }}-${{ matrix.rid }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-${{ matrix.rid }}
          path: Launchpad-${{ inputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
